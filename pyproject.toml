[project]
name = "datime"
version = "2026.0"
description = "Python package with convenience functions for dates, times, and intervals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[[project.authors]]
name = "William Jackson"
email = "william@subtlecoolness.com"

[project.urls]
"Homepage" = "https://github.com/williamjacksn/datime"
"Changes" = "https://github.com/williamjacksn/datime/blob/main/CHANGES.md"
"Issues" = "https://github.com/williamjacksn/datime/issues"

[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.13.0,<0.14.0"]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "uv-build>=0.13.0",
]

[tool.ruff.lint]
extend-select = ["ANN", "DTZ", "E", "F", "FURB", "I", "ICN", "PERF", "Q", "RSE", "RUF", "S", "UP"]
